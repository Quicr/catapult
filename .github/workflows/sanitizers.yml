name: Sanitizers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  asan-ubsan:
    # ASan/UBSan run on Linux only. The Darwin sanitizer runtime
    # (libclang_rt.asan_osx_dynamic) hangs at process init on recent
    # macOS/dyld versions during shadow-memory setup, which produced
    # a silent stall for every test binary linked against it. Linux
    # runners give us deterministic sanitizer coverage across clang
    # and gcc; adding macOS back requires the runtime to be fixed
    # upstream or vendored.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++

    runs-on: ${{ matrix.os }}

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Configure with sanitizers
      run: |
        cmake -S . -B build \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCATAPULT_ENABLE_SANITIZERS=ON \
          -DENABLE_LOGGING=OFF \
          -DCATAPULT_ENABLE_JSON=OFF

    - name: Build
      run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run tests under ASan/UBSan
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      run: ctest --test-dir build --output-on-failure --timeout 600

    - name: Upload sanitizer logs
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: sanitizer-logs-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/Testing/Temporary/LastTest.log

  tsan:
    # ThreadSanitizer failures block merge. The former atomic Treiber free
    # list was replaced by a mutex-guarded bounded object pool, so this job
    # is now enforcing rather than advisory.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Configure with TSan
      run: |
        cmake -S . -B build-tsan \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCATAPULT_ENABLE_TSAN=ON \
          -DENABLE_LOGGING=OFF \
          -DCATAPULT_ENABLE_JSON=OFF

    - name: Build
      run: cmake --build build-tsan -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run tests under TSan
      run: ctest --test-dir build-tsan --output-on-failure --timeout 600

    - name: Upload TSan logs
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: tsan-logs-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build-tsan/Testing/Temporary/LastTest.log
