name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (GitHub-hosted, Ubuntu 24.04)
          - os: ubuntu-latest
            arch: x64
          # Linux arm64 (GitHub-hosted ARM runners, publicly available since 2025-01)
          - os: ubuntu-24.04-arm
            arch: arm64
          # macOS arm64 (macos-latest is Apple Silicon since macos-14)
          - os: macos-latest
            arch: arm64
          # macOS x86_64 pinned to macos-13 to keep coverage on Intel hardware
          - os: macos-13
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Set up dependencies (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev clang-format

    - name: Set up dependencies (macOS)
      if: startsWith(matrix.os, 'macos-')
      run: |
        brew install cmake openssl clang-format

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_LOGGING=ON -DCATAPULT_ENABLE_WERROR=ON ..

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config Release

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.arch }}
        path: build/Testing/Temporary/LastTest.log
