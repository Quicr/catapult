name: Release

on:
  push:
    tags:
      - 'v*'

# Source-artifact release. Catapult is embedded via `add_subdirectory` or
# `find_package(catapult)`; consumers build it themselves, so the release
# does not ship binaries. Instead it publishes:
#
#   - a reproducible source tarball (including vendored submodules),
#   - an SPDX SBOM produced from the source tree,
#   - a sigstore-signed .sig for the tarball (keyless, OIDC-bound),
#   - a SLSA v1.0 provenance attestation.
#
# All three are attached to the GitHub Release so a downstream verifier can
# reproduce the source-to-artifact chain without trusting the release
# manifest alone.

permissions: read-all

jobs:
  build-and-test:
    # Sanity: refuse to publish a tag whose HEAD does not build cleanly and
    # pass tests under the same flags CI uses on main. This is the last
    # gate before source-artifact production. Every test invocation is
    # timeout-bounded so a hung test (like the historical unbounded
    # performance test) cannot burn an entire runner hour.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev nlohmann-json3-dev clang

    - name: Configure + build + test (Werror)
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCATAPULT_ENABLE_WERROR=ON \
          -DENABLE_LOGGING=ON
        cmake --build build -j$(nproc)
        # `--timeout 60` caps each individual test at one minute. Historic
        # performance test hangs never leak into the release runner budget.
        # `-E catapult_performance_tests` excludes the synthetic single-
        # process benchmark from the release gate entirely — it is a dev-
        # local perf signal, not a correctness gate.
        ctest --test-dir build --output-on-failure --timeout 60 -E catapult_performance_tests

    - name: Install + out-of-tree consumer smoke
      # Reuses the same relocatable-install contract enforced on main by
      # the install-consumer job. A tag whose install is broken must not
      # ship.
      run: |
        cmake -S . -B build-install \
          -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/prefix \
          -DENABLE_LOGGING=ON \
          -DCATAPULT_ENABLE_JSON=ON \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-install --target catapult -j$(nproc)
        cmake --install build-install
        CONSUMER=$RUNNER_TEMP/consumer
        mkdir -p $CONSUMER
        cat > $CONSUMER/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(release_consumer CXX)
        set(CMAKE_CXX_STANDARD 20)
        find_package(catapult REQUIRED)
        add_executable(consumer main.cpp)
        target_link_libraries(consumer PRIVATE catapult::catapult)
        EOF
        cat > $CONSUMER/main.cpp <<'EOF'
        #include <catapult/token.hpp>
        int main() { catapult::CatToken t; (void)t; return 0; }
        EOF
        cmake -S $CONSUMER -B $CONSUMER/build \
          -DCMAKE_PREFIX_PATH=$RUNNER_TEMP/prefix
        cmake --build $CONSUMER/build
        $CONSUMER/build/consumer

    - name: Fuzz smoke (30s per harness, ASan/UBSan)
      # Runs the same libFuzzer harnesses the fuzz.yml job runs on main,
      # but for a short 30s each so the release gate never stalls. If any
      # seed corpus crashes ASan/UBSan on the tag commit, the release is
      # aborted before assets are produced.
      run: |
        cmake -S . -B build-fuzz \
          -DCATAPULT_ENABLE_FUZZERS=ON \
          -DCATAPULT_ENABLE_SANITIZERS=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-fuzz --target catapult_fuzz_all -j$(nproc)
        for h in fuzz_strict_cbor fuzz_cwt_decode_payload fuzz_cwt_header \
                 fuzz_base64url fuzz_dpop_deserialize; do
          echo "=== $h ==="
          ./build-fuzz/fuzz/$h -max_total_time=30 fuzz/corpus/$h
        done

  source-artifact:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the GitHub Release
      id-token: write   # OIDC token for keyless sigstore signing
      attestations: write   # SLSA v1.0 provenance
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball }}
      tarball-digest: ${{ steps.pack.outputs.digest }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Compute release metadata
      id: meta
      run: |
        # ${{ github.ref_name }} is the tag (e.g. v1.3.0); strip the leading
        # 'v' to get the semver used inside the tarball name and manifest.
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        # Bind the tarball's file timestamps to the tag's commit time so
        # two independent runs from the same source tree produce byte-
        # identical archives (see reproducibility check below).
        SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "source-date-epoch=${SOURCE_DATE_EPOCH}" >> "$GITHUB_OUTPUT"

    - name: Create reproducible source tarball (including submodules)
      id: pack
      env:
        TAG: ${{ steps.meta.outputs.tag }}
        VERSION: ${{ steps.meta.outputs.version }}
        SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source-date-epoch }}
      run: |
        set -euo pipefail
        # Reproducibility recipe:
        #
        #   1. `--mtime` pins every entry's timestamp to the tag's commit
        #      time (SOURCE_DATE_EPOCH). Without this, tar uses the working
        #      tree's mtimes, which differ between runs.
        #   2. `--sort=name` gives deterministic directory ordering.
        #   3. `--owner=0 --group=0 --numeric-owner` avoids runner-specific
        #      uid/gid metadata.
        #   4. `gzip -n` strips gzip's own timestamp/name from the header,
        #      which is otherwise a per-run source of variance.
        NAME="catapult-${VERSION}"
        TARBALL="${NAME}.tar.gz"
        tar --exclude-vcs \
            --exclude='./build*' \
            --exclude='./tmp' \
            --exclude='./.github' \
            --exclude='**/*.tsan' \
            --exclude='**/*.asan' \
            --sort=name \
            --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --transform "s,^\.,${NAME}," \
            -cf - . | gzip -n -9 > "${TARBALL}"
        DIGEST=$(sha256sum "${TARBALL}" | awk '{print $1}')
        echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Produced ${TARBALL} sha256:${DIGEST}"

    - name: Verify tarball reproducibility
      # Rebuild the exact same tarball from the same working tree and the
      # same SOURCE_DATE_EPOCH. If the two byte streams differ, the release
      # is not reproducible and we abort so we don't sign an artefact whose
      # bit-for-bit provenance we can't defend.
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source-date-epoch }}
        FIRST_DIGEST: ${{ steps.pack.outputs.digest }}
      run: |
        set -euo pipefail
        NAME="catapult-${VERSION}"
        TARBALL2="${NAME}.tar.gz.2"
        tar --exclude-vcs \
            --exclude='./build*' \
            --exclude='./tmp' \
            --exclude='./.github' \
            --exclude='**/*.tsan' \
            --exclude='**/*.asan' \
            --sort=name \
            --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --transform "s,^\.,${NAME}," \
            -cf - . | gzip -n -9 > "${TARBALL2}"
        SECOND_DIGEST=$(sha256sum "${TARBALL2}" | awk '{print $1}')
        echo "first:  ${FIRST_DIGEST}"
        echo "second: ${SECOND_DIGEST}"
        if [ "${FIRST_DIGEST}" != "${SECOND_DIGEST}" ]; then
          echo "::error::source tarball is not reproducible under fixed SOURCE_DATE_EPOCH"
          exit 1
        fi
        rm -f "${TARBALL2}"

    - name: Generate SPDX SBOM
      # anchore/sbom-action wraps syft and emits a valid SPDX 2.3 document
      # covering the source tree. We deliberately point it at the checkout
      # (not the tarball) so it inspects the actual file contents, then
      # attach the SPDX file to the release alongside the tarball.
      uses: anchore/sbom-action@d94b174e4c0e04b6d84b2ecb04d59da9c81ee9b3 # v0.17.9
      with:
        path: .
        format: spdx-json
        output-file: catapult-${{ steps.meta.outputs.version }}.spdx.json
        artifact-name: catapult-${{ steps.meta.outputs.version }}.spdx.json

    - name: Install cosign
      uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

    - name: Keyless-sign the tarball with sigstore
      # Keyless flow: cosign uses the GitHub OIDC token to obtain a
      # short-lived Fulcio certificate bound to this workflow run and
      # writes the signature to Rekor (the public transparency log).
      # Verifiers can reproduce the chain with `cosign verify-blob` using
      # only the workflow identity — no long-lived keys are stored.
      env:
        COSIGN_EXPERIMENTAL: "1"
        TARBALL: ${{ steps.pack.outputs.tarball }}
      run: |
        cosign sign-blob --yes \
          --output-signature "${TARBALL}.sig" \
          --output-certificate "${TARBALL}.pem" \
          "${TARBALL}"

    - name: Attest SLSA v1.0 provenance
      # actions/attest-build-provenance produces an in-toto attestation
      # bound to the workflow's OIDC identity and uploads it to sigstore's
      # transparency log. Consumers can verify with:
      #   gh attestation verify catapult-<version>.tar.gz --owner <org>
      uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
      with:
        subject-path: ${{ steps.pack.outputs.tarball }}

    - name: Verify signed assets before publishing
      # cosign verify-blob replays the entire keyless chain against the
      # certificate we just produced. If the tarball has been mutated
      # between the `pack` step and here — or if the signature is not
      # actually valid for this file — the release aborts before the
      # GitHub Release is created. This is the last defence against
      # publishing an unusable signature.
      env:
        TARBALL: ${{ steps.pack.outputs.tarball }}
      run: |
        cosign verify-blob \
          --certificate "${TARBALL}.pem" \
          --signature   "${TARBALL}.sig" \
          --certificate-identity-regexp 'https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.*' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "${TARBALL}"

    - name: Create GitHub Release with all artefacts
      uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
      with:
        generate_release_notes: true
        files: |
          ${{ steps.pack.outputs.tarball }}
          ${{ steps.pack.outputs.tarball }}.sig
          ${{ steps.pack.outputs.tarball }}.pem
          catapult-${{ steps.meta.outputs.version }}.spdx.json
        body: |
          ## Source artefacts

          - `${{ steps.pack.outputs.tarball }}` — reproducible source tarball
            with all vendored submodules
            (`sha256:${{ steps.pack.outputs.digest }}`, tag-locked mtime)
          - `*.sig` / `*.pem` — sigstore keyless signature + Fulcio cert,
            verified by the release job itself before publishing
          - `*.spdx.json` — SPDX 2.3 SBOM of the source tree

          Verify (requires the cosign and gh CLIs):

          ```sh
          cosign verify-blob \
            --certificate catapult-${{ steps.meta.outputs.version }}.tar.gz.pem \
            --signature   catapult-${{ steps.meta.outputs.version }}.tar.gz.sig \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release\.yml@refs/tags/v.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            catapult-${{ steps.meta.outputs.version }}.tar.gz

          gh attestation verify \
            catapult-${{ steps.meta.outputs.version }}.tar.gz \
            --repo ${{ github.repository }}
          ```
